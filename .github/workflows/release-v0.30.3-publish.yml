name: Publish v0.30.3 (one-shot)

on:
    workflow_run:
        workflows:
            - Build and Make Electron App
        types:
            - completed

permissions:
    contents: write
    actions: read

jobs:
    publish:
        if: >-
            github.repository == 'mkaand/iptvnator' &&
            github.event.workflow_run.event == 'workflow_dispatch' &&
            github.event.workflow_run.head_branch == 'v0.30.3' &&
            github.event.workflow_run.head_sha == '23f21a98e3f18a9d18af9a6a6d27a420ebd43d8a' &&
            github.event.workflow_run.conclusion == 'success'
        runs-on: ubuntu-latest
        steps:
            - name: Verify and publish exact stable draft
              shell: bash
              env:
                  GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
                  RELEASE_TAG: v0.30.3
                  EXPECTED_SHA: 23f21a98e3f18a9d18af9a6a6d27a420ebd43d8a
              run: |
                  set -euo pipefail

                  ref_sha="$(gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$RELEASE_TAG" --jq '.object.sha')"
                  if [[ "$ref_sha" != "$EXPECTED_SHA" ]]; then
                      echo "::error::$RELEASE_TAG points to $ref_sha, expected $EXPECTED_SHA"
                      exit 1
                  fi

                  release="$(gh api "repos/$GITHUB_REPOSITORY/releases/tags/$RELEASE_TAG")"
                  release_id="$(jq -r '.id' <<< "$release")"
                  tag="$(jq -r '.tag_name' <<< "$release")"
                  draft="$(jq -r '.draft' <<< "$release")"
                  prerelease="$(jq -r '.prerelease' <<< "$release")"

                  if [[ "$tag" != "$RELEASE_TAG" || "$prerelease" != "false" ]]; then
                      echo "::error::Unexpected release identity/state."
                      exit 1
                  fi

                  assets="$(gh api "repos/$GITHUB_REPOSITORY/releases/$release_id/assets?per_page=100")"
                  jq -e 'length == 18 and all(.[]; .state == "uploaded" and .size > 0)' <<< "$assets" >/dev/null

                  required=(
                      "iptvnator-0.30.3-windows-x64-setup.exe"
                      "latest.yml"
                      "iptvnator-0.30.3-linux-amd64.deb"
                      "iptvnator-0.30.3-linux-x86_64.AppImage"
                      "iptvnator-0.30.3-linux-x86_64.rpm"
                      "iptvnator-0.30.3-linux-x64.pacman"
                      "iptvnator-0.30.3-linux-x86_64.flatpak"
                      "linux-frame-copy-runtime-sources.tar.xz"
                  )
                  for name in "${required[@]}"; do
                      jq -e --arg name "$name" 'any(.[]; .name == $name)' <<< "$assets" >/dev/null || {
                          echo "::error::Required stable asset missing: $name"
                          exit 1
                      }
                  done

                  if [[ "$draft" == "false" ]]; then
                      echo "$RELEASE_TAG is already public with the verified asset set."
                      exit 0
                  fi

                  if [[ "$draft" != "true" ]]; then
                      echo "::error::Expected a draft release before publication."
                      exit 1
                  fi

                  jq -n '{draft:false, prerelease:false, make_latest:"true"}' |
                      gh api -X PATCH "repos/$GITHUB_REPOSITORY/releases/$release_id" --input - >/dev/null

                  published="$(gh api "repos/$GITHUB_REPOSITORY/releases/tags/$RELEASE_TAG")"
                  jq -e '.draft == false and .prerelease == false' <<< "$published" >/dev/null
                  echo "$RELEASE_TAG published after exact tag and 18-asset verification."
