name: Finalize v0.30.3 (one-shot)

on:
    push:
        branches:
            - master

permissions:
    contents: write
    actions: write

jobs:
    finalize:
        if: >-
            github.repository == 'mkaand/iptvnator' &&
            github.event.head_commit.message == 'chore(release): finalize v0.30.3'
        runs-on: ubuntu-latest
        steps:
            - name: Ensure exact stable release is public
              shell: bash
              env:
                  GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
                  RELEASE_TAG: v0.30.3
                  EXPECTED_SHA: 23f21a98e3f18a9d18af9a6a6d27a420ebd43d8a
                  BUILD_WORKFLOW: build-and-make.yaml
              run: |
                  set -euo pipefail

                  ref_sha="$(gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$RELEASE_TAG" --jq '.object.sha')"
                  if [[ "$ref_sha" != "$EXPECTED_SHA" ]]; then
                      echo "::error::$RELEASE_TAG points to $ref_sha, expected $EXPECTED_SHA"
                      exit 1
                  fi

                  release_ready() {
                      local release release_id tag draft prerelease assets
                      if ! release="$(gh api "repos/$GITHUB_REPOSITORY/releases/tags/$RELEASE_TAG" 2>/dev/null)"; then
                          return 2
                      fi
                      release_id="$(jq -r '.id' <<< "$release")"
                      tag="$(jq -r '.tag_name' <<< "$release")"
                      draft="$(jq -r '.draft' <<< "$release")"
                      prerelease="$(jq -r '.prerelease' <<< "$release")"
                      [[ "$tag" == "$RELEASE_TAG" && "$prerelease" == "false" ]] || return 4

                      assets="$(gh api "repos/$GITHUB_REPOSITORY/releases/$release_id/assets?per_page=100")"
                      jq -e 'length == 18 and all(.[]; .state == "uploaded" and .size > 0)' <<< "$assets" >/dev/null || return 3

                      required=(
                          "iptvnator-0.30.3-windows-x64-setup.exe"
                          "latest.yml"
                          "iptvnator-0.30.3-linux-amd64.deb"
                          "iptvnator-0.30.3-linux-x86_64.AppImage"
                          "iptvnator-0.30.3-linux-x86_64.rpm"
                          "iptvnator-0.30.3-linux-x64.pacman"
                          "iptvnator-0.30.3-linux-x86_64.flatpak"
                          "linux-frame-copy-runtime-sources.tar.xz"
                      )
                      for name in "${required[@]}"; do
                          jq -e --arg name "$name" 'any(.[]; .name == $name)' <<< "$assets" >/dev/null || return 3
                      done

                      if [[ "$draft" == "true" ]]; then
                          jq -n '{draft:false, prerelease:false, make_latest:"true"}' |
                              gh api -X PATCH "repos/$GITHUB_REPOSITORY/releases/$release_id" --input - >/dev/null
                      elif [[ "$draft" != "false" ]]; then
                          return 4
                      fi

                      release="$(gh api "repos/$GITHUB_REPOSITORY/releases/tags/$RELEASE_TAG")"
                      jq -e '.draft == false and .prerelease == false' <<< "$release" >/dev/null
                      echo "Verified public $RELEASE_TAG with 18/18 nonempty assets."
                  }

                  set +e
                  release_ready
                  status=$?
                  set -e

                  if [[ "$status" != "0" ]]; then
                      if [[ "$status" != "2" && "$status" != "3" ]]; then
                          echo "::error::Unexpected existing release state."
                          exit "$status"
                      fi

                      echo "Stable draft is missing or incomplete; dispatching exact tag build."
                      dispatch_started="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
                      gh workflow run "$BUILD_WORKFLOW" --repo "$GITHUB_REPOSITORY" --ref "$RELEASE_TAG"

                      run_id=""
                      for _ in {1..30}; do
                          run_id="$(gh run list                               --repo "$GITHUB_REPOSITORY"                               --workflow "$BUILD_WORKFLOW"                               --event workflow_dispatch                               --branch "$RELEASE_TAG"                               --limit 20                               --json databaseId,headSha,createdAt                               --jq --arg sha "$EXPECTED_SHA" --arg started "$dispatch_started"                               '[.[] | select(.headSha == $sha and .createdAt >= $started)] | sort_by(.createdAt) | reverse | .[0].databaseId // empty')"
                          [[ -n "$run_id" ]] && break
                          sleep 6
                      done
                      [[ -n "$run_id" ]] || {
                          echo "::error::Dispatched stable build did not appear."
                          exit 1
                      }

                      echo "Watching stable build run $run_id"
                      gh run watch "$run_id" --repo "$GITHUB_REPOSITORY" --exit-status
                      release_ready
                  fi

            - name: Checkout master for README finalization
              uses: actions/checkout@v7
              with:
                  ref: master
                  fetch-depth: 0

            - name: Update README stable release section
              shell: python
              run: |
                  from pathlib import Path

                  path = Path("README.md")
                  text = path.read_text(encoding="utf-8")
                  text = text.replace("## Stable release — v0.30.2", "## Stable release — v0.30.3", 1)
                  text = text.replace(
                      "**Released November 21, 2026.** [Release notes and all downloads](https://github.com/mkaand/iptvnator/releases/tag/v0.30.2)",
                      "**Released November 24, 2026.** [Release notes and all downloads](https://github.com/mkaand/iptvnator/releases/tag/v0.30.3)",
                      1,
                  )
                  head, sep, tail = text.partition("## Improvements compared with the original project")
                  if not sep:
                      raise SystemExit("README stable section boundary not found")
                  head = head.replace("/releases/download/v0.30.2/", "/releases/download/v0.30.3/")
                  head = head.replace("iptvnator-0.30.2-", "iptvnator-0.30.3-")
                  head = head.replace("No public fork installer for v0.30.2", "No public fork installer for v0.30.3")
                  text = head + sep + tail
                  text = text.replace(
                      "The published v0.30.2 release contains 18 verified assets",
                      "The published v0.30.3 release contains 18 verified assets",
                      1,
                  )
                  path.write_text(text, encoding="utf-8")

            - name: Remove one-shot workflow and commit README
              shell: bash
              run: |
                  set -euo pipefail
                  rm -f .github/workflows/release-v0.30.3-publish.yml
                  git config user.name "mkaand"
                  git config user.email "21102029+mkaand@users.noreply.github.com"
                  git add README.md .github/workflows/release-v0.30.3-publish.yml
                  git diff --cached --check
                  git commit -m "docs: publish v0.30.3 stable release" -m "Co-Authored-By: codex <codex@openai.com>"
                  git push origin HEAD:master
