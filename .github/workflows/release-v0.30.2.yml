name: Cut IPTVnator v0.30.2 Stable Tag

on:
    push:
        branches:
            - master

permissions:
    contents: read

jobs:
    cut-tag:
        name: Tag merged v0.30.2 and dispatch stable packaging
        if: github.repository == 'mkaand/iptvnator'
        runs-on: ubuntu-latest
        timeout-minutes: 10
        permissions:
            contents: write
            actions: write
        steps:
            - name: Checkout the merged master commit
              uses: actions/checkout@v7
              with:
                  fetch-depth: 0

            - name: Create immutable stable tag and start its build
              shell: bash
              env:
                  GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
              run: |
                  set -euo pipefail
                  VERSION="$(node -p 'require("./package.json").version')"
                  if [ "${VERSION}" != "0.30.2" ]; then
                      echo "No v0.30.2 cut: master version is ${VERSION}."
                      exit 0
                  fi

                  MERGED="$(gh api "repos/${GITHUB_REPOSITORY}/pulls/5" --jq '.merged')"
                  if [ "${MERGED}" != "true" ]; then
                      echo "::error::PR #5 must be merged before creating the stable tag."
                      exit 1
                  fi

                  TAG="v0.30.2"
                  if gh api "repos/${GITHUB_REPOSITORY}/git/ref/tags/${TAG}" >/dev/null 2>&1; then
                      echo "Existing ${TAG} is immutable; not moving it."
                  else
                      git config user.name github-actions[bot]
                      git config user.email 41898282+github-actions[bot]@users.noreply.github.com
                      git tag -a "${TAG}" -m "IPTVnator stable ${TAG}" "${GITHUB_SHA}"
                      git push origin "refs/tags/${TAG}"
                  fi

                  # GITHUB_TOKEN tag pushes do not trigger a second workflow
                  # automatically. workflow_dispatch is an allowed exception.
                  if gh release view "${TAG}" --repo "${GITHUB_REPOSITORY}" \
                      --json isDraft --jq '.isDraft' 2>/dev/null | grep -qx false; then
                      echo "${TAG} is already public; no rebuild."
                      exit 0
                  fi
                  gh workflow run build-and-make.yaml --repo "${GITHUB_REPOSITORY}" --ref "${TAG}"
                  echo "Requested the stable tag build for ${TAG}."
