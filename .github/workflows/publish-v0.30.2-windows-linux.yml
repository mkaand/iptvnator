name: Publish IPTVnator v0.30.2 Windows and Linux

# One-off recovery publisher for the already-built, immutable v0.30.2 tag.
# macOS is intentionally excluded because Developer ID signing credentials
# are unavailable. No E2E, updater checksum, or asset validation is skipped.
on:
  push:
    branches:
      - master
    paths:
      - '.github/workflows/publish-v0.30.2-windows-linux.yml'
  workflow_dispatch:

permissions:
  contents: write
  actions: read

concurrency:
  group: iptvnator-v0.30.2-windows-linux-publish
  cancel-in-progress: false

jobs:
  publish:
    name: Verify and publish 18 Windows/Linux assets
    if: github.repository == 'mkaand/iptvnator'
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      SOURCE_RUN: '44831749791'
      TAG: 'v0.30.2'
      EXPECTED_COMMIT: 'a1bcd5196d71a7cf28077c9d0b9bf7ef1042bfea'
    steps:
      - name: Checkout immutable release tag
        uses: actions/checkout@v7
        with:
          ref: v0.30.2
          fetch-depth: 0

      - name: Verify tag, fork, and existing green CI
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REPOSITORY" = "mkaand/iptvnator"
          test "$(git rev-parse HEAD)" = "$EXPECTED_COMMIT"
          test "$(node -p 'require("./package.json").version')" = '0.30.2'
          for run in 44831713624 44831713643; do
            conclusion="$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$run" --jq '.conclusion')"
            if [ "$conclusion" != success ]; then
              echo "::error::CI/E2E run $run is not successful: $conclusion"
              exit 1
            fi
          done
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$SOURCE_RUN/jobs?per_page=100" > jobs.json
          for job in "Build on windows x64" "Build on linux x64 (system)" "Build on linux x64 (portable)" "Build on linux x64 (flatpak)"; do
            if ! jq -e --arg name "$job" 'any(.jobs[]; .name == $name and .conclusion == "success")' jobs.json >/dev/null; then
              echo "::error::Required source build failed or missing: $job"
              exit 1
            fi
          done
          echo "Tag, CI, E2E, Windows and Linux jobs verified."

      - name: Retrieve exact successful tag-build artifacts
        shell: bash
        run: |
          set -euo pipefail
          for artifact in windows-artifacts linux-system-artifacts linux-portable-artifacts linux-flatpak-artifacts linux-frame-copy-runtime-sources; do
            mkdir -p "artifacts/$artifact"
            gh run download "$SOURCE_RUN" --repo "$GITHUB_REPOSITORY" --name "$artifact" --dir "artifacts/$artifact"
          done

      - name: Stage exactly 18 distributable files and verify updater feeds
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p staging
          cat > expected-assets.txt <<'EXPECTED'
          linux-system-artifacts|iptvnator-0.30.2-linux-armv7l.deb
          linux-system-artifacts|iptvnator-0.30.2-linux-arm64.deb
          linux-system-artifacts|iptvnator-0.30.2-linux-amd64.deb
          linux-system-artifacts|iptvnator-0.30.2-linux-x86_64.rpm
          linux-system-artifacts|iptvnator-0.30.2-linux-x64.pacman
          linux-portable-artifacts|iptvnator-0.30.2-linux-x86_64.AppImage
          linux-portable-artifacts|iptvnator-0.30.2-linux-armv7l.AppImage
          linux-portable-artifacts|iptvnator-0.30.2-linux-arm64.AppImage
          linux-portable-artifacts|iptvnator-0.30.2-linux-armhf.snap
          linux-portable-artifacts|iptvnator-0.30.2-linux-amd64.snap
          linux-portable-artifacts|latest-linux.yml
          linux-portable-artifacts|latest-linux-arm64.yml
          linux-portable-artifacts|latest-linux-arm.yml
          linux-flatpak-artifacts|iptvnator-0.30.2-linux-x86_64.flatpak
          linux-frame-copy-runtime-sources|linux-frame-copy-runtime-sources.tar.xz
          windows-artifacts|iptvnator-0.30.2-windows-x64-setup.exe
          windows-artifacts|latest.yml
          windows-artifacts|iptvnator-0.30.2-windows-x64-setup.exe.blockmap
          EXPECTED
          while IFS='|' read -r folder file; do
            source="artifacts/$folder/$file"
            if [ ! -s "$source" ]; then
              echo "::error::Missing or empty artifact: $source"
              exit 1
            fi
            cp -- "$source" "staging/$file"
          done < expected-assets.txt
          actual="$(find staging -maxdepth 1 -type f | wc -l | tr -d ' ')"
          test "$actual" = 18

          feed="staging/latest.yml"
          installer="staging/iptvnator-0.30.2-windows-x64-setup.exe"
          test "$(grep -c '^version: 0\.30\.2$' "$feed")" = 1
          grep -Fq 'iptvnator-0.30.2-windows-x64-setup.exe' "$feed"
          digest="$(openssl dgst -sha512 -binary "$installer" | base64 -w0)"
          if ! grep -Fq "$digest" "$feed"; then
            echo "::error::Windows latest.yml SHA512 differs from installer bytes"
            exit 1
          fi
          for linuxfeed in staging/latest-linux*.yml; do
            grep -Eq '^version: 0\.30\.2$' "$linuxfeed" || {
              echo "::error::Linux updater feed version mismatch: $linuxfeed"
              exit 1
            }
          done
          sha256sum staging/* > artifact-sha256.txt
          echo "Validated 18 assets, Windows updater SHA512, and Linux feed versions."

      - name: Write release notes
        shell: bash
        run: |
          cat > release-notes.md <<'NOTES'
          # IPTVnator v0.30.2 — stable fork release

          This stable release provides Windows x64 and Linux installers/packages from the verified `v0.30.2` source tag at commit `a1bcd5196d71a7cf28077c9d0b9bf7ef1042bfea`.

          **Supported distribution packages in this release:** Windows x64 installer; Linux DEB (amd64/arm64/armv7l), RPM, Pacman, AppImage (x86_64/arm64/armv7l), Snap, and Flatpak. The release includes the Windows and Linux update metadata files and an LGPL-related Linux runtime source archive.

          **macOS is not included in v0.30.2.** The macOS packaging jobs require Apple Developer ID signing and notarization credentials that are not configured for this fork. They were not passed off as successful, and unsigned macOS distributions were not substituted.

          **Changes:** M3U navigation and global search performance improvements; EPG integration in Live TV and Favorites; last-played channel behavior; update notifications and the About page; desktop packaging and cross-platform regression tests. See [PR #5](https://github.com/mkaand/iptvnator/pull/5) for implementation details.

          **Updating on Windows:** In an existing installation of this fork, use Settings → About → Check for Updates. This release includes `latest.yml` and a matching Windows installer, allowing the built-in Electron updater to discover and download this stable version. Real-world in-app upgrade acceptance from v0.30.1 to v0.30.2 remains to be performed on Windows.

          **Verification:** Master branch CI and Cross-Platform E2E workflows passed. Windows and Linux stable-tag packaging jobs passed; the published Windows `latest.yml` SHA-512 is checked against the actual installer before publication. Public publication occurs only when all 18 expected nonempty Windows/Linux assets are uploaded.

          Back up important playlists and data before upgrading. Private playlist and EPG URLs are never included in this release.
          NOTES

      - name: Create draft, upload, verify, and atomically publish
        shell: bash
        run: |
          set -euo pipefail
          existing="$(gh api "repos/$GITHUB_REPOSITORY/releases?per_page=100" --jq '.[] | select(.tag_name == "v0.30.2") | .id' | head -n1)"
          if [ -n "$existing" ]; then
            is_draft="$(gh api "repos/$GITHUB_REPOSITORY/releases/$existing" --jq '.draft')"
            if [ "$is_draft" != true ]; then
              echo "::error::v0.30.2 is already public; refusing to overwrite published assets"
              exit 1
            fi
            release_id="$existing"
          else
            gh release create "$TAG" --repo "$GITHUB_REPOSITORY" --verify-tag --draft \
              --title "IPTVnator v0.30.2 — Windows & Linux Stable" \
              --notes-file release-notes.md
            release_id="$(gh api "repos/$GITHUB_REPOSITORY/releases?per_page=100" --jq '.[] | select(.tag_name == "v0.30.2" and .draft == true) | .id' | head -n1)"
            test -n "$release_id"
          fi

          gh release upload "$TAG" staging/* --repo "$GITHUB_REPOSITORY" --clobber

          gh api "repos/$GITHUB_REPOSITORY/releases/$release_id" > release.json
          jq -e '.draft == true and .prerelease == false and .tag_name == "v0.30.2"' release.json >/dev/null
          gh api "repos/$GITHUB_REPOSITORY/releases/$release_id/assets?per_page=100" > uploaded-assets.json
          count="$(jq 'length' uploaded-assets.json)"
          if [ "$count" != 18 ]; then
            echo "::error::Draft asset count $count, expected 18"
            exit 1
          fi
          jq -e 'all(.[]; .state == "uploaded" and .size > 0)' uploaded-assets.json >/dev/null
          while IFS='|' read -r folder file; do
            if ! jq -e --arg file "$file" '[.[] | select(.name == $file)] | length == 1' uploaded-assets.json >/dev/null; then
              echo "::error::Missing or duplicate uploaded release asset: $file"
              exit 1
            fi
          done < expected-assets.txt

          jq -n '{tag_name:"v0.30.2", draft:false, prerelease:false}' |
            gh api -X PATCH "repos/$GITHUB_REPOSITORY/releases/$release_id" --input - > public-release.json
          jq -e '.draft == false and .prerelease == false and .tag_name == "v0.30.2"' public-release.json >/dev/null
          echo "PUBLIC RELEASE: $(jq -r '.html_url' public-release.json)"
