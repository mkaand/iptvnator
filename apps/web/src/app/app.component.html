<app-startup-status #startup [ready]="ready()" />
<div [style.display]="startup.complete() ? 'contents' : 'none'">
    <router-outlet (activate)="ready.set(true)" />
</div>

@defer (on immediate) {
    @if (runtime.usesCustomWindowControls) {
        <app-window-controls />
    }
}

<!-- One deferred mount for background panels; both event listeners start
     before rendering and keep short EPG imports and update notices visible. -->
@defer (when progress.isVisible() || updateNotice()) {
    <app-epg-progress-panel />
    <app-update-notification-panel [initialStatus]="updateNotice()" />
}
