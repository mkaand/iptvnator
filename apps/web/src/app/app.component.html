<app-startup-status #startup [routeReady]="routeReady()" />
<div [style.display]="startup.complete() ? 'contents' : 'none'">
    <router-outlet (activate)="routeReady.set(true)" />
</div>

@defer (on immediate) {
    @if (runtime.usesCustomWindowControls) {
        <app-window-controls />
    }
}

<!-- Listen for progress immediately, but render only when an import appears. -->
@defer (when epgProgress.isVisible()) {
    <app-epg-progress-panel />
}

<!-- The updater's lightweight status listener is live from app construction. -->
@defer (when mountUpdatePanel()) {
    <app-update-notification-panel />
}
